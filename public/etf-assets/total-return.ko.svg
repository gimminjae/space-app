<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc">
<title id="title">현금만 세면 절반을 놓칩니다</title><desc id="desc">(남은 자산 + 받은 현금 − 처음 투자금) ÷ 처음 투자금 가상 예시 · 재투자, 세금과 비용 제외 · 특정 ETF의 성과가 아닙니다.</desc>
<rect width="1400" height="880" rx="24" fill="#f5f3eb"/>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif">
<text x="70" y="76" font-size="22" fill="#306a54" font-weight="700" text-anchor="start">SPACE / ETF</text>
<text x="70" y="144" font-size="44" fill="#19392f" font-weight="700" text-anchor="start">현금만 세면 절반을 놓칩니다</text>
<text x="70" y="193" font-size="25" fill="#64756e" font-weight="400" text-anchor="start">(남은 자산 + 받은 현금 − 처음 투자금) ÷ 처음 투자금</text>
<rect x="70" y="248" width="590" height="460" rx="18" fill="white"/><text x="105" y="305" font-size="27" fill="#19392f" font-weight="600" text-anchor="start">A  ·  처음 투자한 돈 1,000</text><text x="105" y="368" font-size="25" fill="#64756e" font-weight="400" text-anchor="start">남은 자산</text><text x="620" y="368" font-size="32" fill="#19392f" font-weight="600" text-anchor="end">900</text><text x="105" y="427" font-size="25" fill="#64756e" font-weight="400" text-anchor="start">받은 현금</text><text x="620" y="427" font-size="32" fill="#19392f" font-weight="600" text-anchor="end">+ 80</text><path d="M105 455H625" stroke="#dbe1d7"/><text x="105" y="512" font-size="26" fill="#19392f" font-weight="600" text-anchor="start">합계</text><text x="620" y="512" font-size="40" fill="#19392f" font-weight="700" text-anchor="end">980</text><text x="105" y="591" font-size="25" fill="#64756e" font-weight="400" text-anchor="start">단순 총수익률</text><text x="620" y="640" font-size="64" fill="#935a43" font-weight="700" text-anchor="end">−2%</text><rect x="740" y="248" width="590" height="460" rx="18" fill="white"/><text x="775" y="305" font-size="27" fill="#19392f" font-weight="600" text-anchor="start">B  ·  처음 투자한 돈 1,000</text><text x="775" y="368" font-size="25" fill="#64756e" font-weight="400" text-anchor="start">남은 자산</text><text x="1290" y="368" font-size="32" fill="#19392f" font-weight="600" text-anchor="end">1,050</text><text x="775" y="427" font-size="25" fill="#64756e" font-weight="400" text-anchor="start">받은 현금</text><text x="1290" y="427" font-size="32" fill="#19392f" font-weight="600" text-anchor="end">+ 30</text><path d="M775 455H1295" stroke="#dbe1d7"/><text x="775" y="512" font-size="26" fill="#19392f" font-weight="600" text-anchor="start">합계</text><text x="1290" y="512" font-size="40" fill="#19392f" font-weight="700" text-anchor="end">1,080</text><text x="775" y="591" font-size="25" fill="#64756e" font-weight="400" text-anchor="start">단순 총수익률</text><text x="1290" y="640" font-size="64" fill="#306a54" font-weight="700" text-anchor="end">+8%</text>
<path d="M70 773H1330" stroke="#cdd5cc"/>
<text x="70" y="818" font-size="23" fill="#64756e" font-weight="400" text-anchor="start">가상 예시 · 재투자, 세금과 비용 제외 · 특정 ETF의 성과가 아닙니다.</text>
</g></svg>