<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc">
<title id="title">Cash is only part of the result</title><desc id="desc">(Assets remaining + cash received − initial investment) ÷ initial investment Hypothetical; excludes reinvestment, taxes and costs. Not actual ETF performance.</desc>
