<text x="70" y="144" font-size="44" fill="#19392f" font-weight="700" text-anchor="start">Cash is only part of the result</text>
<text x="70" y="193" font-size="25" fill="#64756e" font-weight="400" text-anchor="start">(Assets remaining + cash received − initial investment) ÷ initial investment</text>
